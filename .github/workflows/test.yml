name: Test Suite

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  deployment-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend, worker and frontend images
        run: |
          docker build --file backend/Dockerfile --tag breadwinner-backend:${{ github.sha }} .
          docker build --file backend/Dockerfile.sync-worker --tag breadwinner-worker:${{ github.sha }} .
          docker build --file frontend/Dockerfile.railway --tag breadwinner-frontend:${{ github.sha }} --build-arg VITE_API_URL=https://test-api.example.com/api/v1 frontend
      - name: Verify fresh startup and persistence with disposable containers
        run: python3 backend/scripts/check_installation_containers.py ${{ github.sha }}
      - name: Verify local Compose bootstrap and recreation
        run: python3 backend/scripts/check_compose_installation.py ${{ github.sha }}

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_delivery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_delivery_ci
          TEST_WORKSPACE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/test_workspace_migration
          TEST_INSTALL_BOOTSTRAP_URL: postgresql://postgres:postgres@localhost:5432/test_install_bootstrap
          TEST_CUTOVER_UPGRADE_URL: postgresql://postgres:postgres@localhost:5432/test_cutover_upgrade
          SECRET_KEY: test-secret-key-for-ci
          GEMINI_API_KEY: mock-key
          FAL_AI_API_KEY: mock-key
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql://postgres:postgres@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE test_workspace_migration"))
              connection.execute(text("CREATE DATABASE test_install_bootstrap"))
              connection.execute(text("CREATE DATABASE test_cutover_upgrade"))
          engine.dispose()
          PY
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend unit tests and build
        working-directory: frontend
        run: |
          npm run test:unit
          npm run build

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run Bandit (Python SAST)
        working-directory: backend
        run: bandit -r app/ -ll -ii -x '**/tests/**' || true

      - name: Run pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true
