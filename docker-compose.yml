# Local development only. Supply credentials through the process environment.
# Start: docker compose --env-file /dev/null up --build
# Stop, preserving data: docker compose --env-file /dev/null down

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://ads_studio:ads_studio_dev_password@postgres:5432/ads_studio_dev
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the process environment}
  OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:?Set OAUTH_TOKEN_ENCRYPTION_KEY in the process environment}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads_studio_dev
      POSTGRES_USER: ads_studio
      POSTGRES_PASSWORD: ads_studio_dev_password
    volumes:
      - ads_studio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_studio -d ads_studio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - python -c 'from startup import bootstrap_database; bootstrap_database()' && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      <<: *backend-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: http://localhost:${AD_STUDIO_FRONTEND_PORT:-5173},http://127.0.0.1:${AD_STUDIO_FRONTEND_PORT:-5173}
      FRONTEND_URL: http://localhost:${AD_STUDIO_FRONTEND_PORT:-5173}
      PUBLIC_API_URL: http://localhost:${AD_STUDIO_BACKEND_PORT:-8000}
      MEDIA_STORAGE_PATH: /app/uploads
      GOOGLE_ADS_OAUTH_REDIRECT_URI: http://localhost:${AD_STUDIO_BACKEND_PORT:-8000}/api/v1/google-ads/oauth/callback
      TIKTOK_ADS_OAUTH_REDIRECT_URI: http://localhost:${AD_STUDIO_BACKEND_PORT:-8000}/api/v1/tiktok-ads/oauth/callback
    volumes:
      - ./backend:/app
      - ads_studio_media:/app/uploads
    ports:
      - "127.0.0.1:${AD_STUDIO_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.sync-worker
    command: ["python", "-m", "app.sync_worker"]
    environment: *backend-environment
    volumes:
      - ./backend/app:/app/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      DEV_API_PROXY_TARGET: http://backend:8000
      VITE_API_URL: /api/v1
    volumes:
      - ./frontend:/app
      - ads_studio_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${AD_STUDIO_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ads_studio_postgres_data:
  ads_studio_media:
  ads_studio_node_modules:
